# Built JS/CSS have a content hash in their name, so they can be cached for good.
# Everything else (index.html above all) is checked on every visit, so an update
# shows up straight away instead of an old page that points at old code.
map $uri $mnq_cache {
    ~\.(js|css)$  "public, max-age=31536000, immutable";
    default        "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Only this site's own code may run. Cloudflare is allowed for the "are you human"
    # check, Google for the "Continue with Google" button, S3 for screenshots,
    # Google Fonts for the mono font.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com https://accounts.google.com/gsi/; frame-src https://challenges.cloudflare.com https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $mnq_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The "Add to Home Screen" manifest: nginx's built-in types don't know .webmanifest
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }
}
