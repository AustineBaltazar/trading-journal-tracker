<div class="flex h-screen">
  <nav class="w-64 bg-[#0B0E14] border-r border-[#1F293D]/60 flex flex-col shrink-0 h-full">
    <!-- Brand new -->
    <div class="p-5 flex items-center gap-3 border-b border-[#1F293D]/60">
      <div
        class="h-9 w-9 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-400 p-[1.5px] flex items-center justify-center shadow-lg shadow-blue-500/20"
      >
        <div class="h-full w-full bg-[#0B0E14] rounded-[10px] flex items-center justify-center">
          <svg
            class="w-5 h-5 text-emerald-400"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            viewBox="0 0 24 24"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
        </div>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-1.5">
          <span class="font-extrabold tracking-tight text-white text-sm">MNQ</span>
          <span class="text-xs text-slate-500 font-mono">/</span>
          <span class="text-xs font-semibold text-slate-300 tracking-wider">JOURNAL</span>
        </div>
        <span class="text-[10px] text-slate-500">Futures Session</span>
      </div>
    </div>

    <!-- Live / backtest switch: decides which trades every page shows -->
    <div class="px-3 pt-3">
      <div
        role="radiogroup"
        aria-label="Trade mode"
        class="grid grid-cols-2 gap-1 p-1 rounded-xl bg-[#0e1626] border border-[#1c2840] text-xs font-semibold"
      >
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="!tradeMode.isBacktest()"
          (click)="tradeMode.set('live')"
          class="py-1.5 rounded-lg border transition-colors"
          [class]="
            tradeMode.isBacktest()
              ? 'border-transparent text-slate-400 hover:text-slate-200'
              : 'bg-emerald-500/15 text-emerald-400 border-emerald-500/40'
          "
        >
          Live
        </button>
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="tradeMode.isBacktest()"
          (click)="tradeMode.set('backtest')"
          class="py-1.5 rounded-lg border transition-colors"
          [class]="
            tradeMode.isBacktest()
              ? 'bg-violet-500/15 text-violet-300 border-violet-500/45'
              : 'border-transparent text-slate-400 hover:text-slate-200'
          "
        >
          Backtest
        </button>
      </div>
    </div>

    <!-- Nav links -->
    <div class="p-3 flex flex-col gap-1">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-[#121722] text-white border border-[#1F293D]/60"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-[#121722] transition-all text-sm font-medium"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect height="7" rx="1" width="7" x="3" y="3" />
          <rect height="7" rx="1" width="7" x="14" y="3" />
          <rect height="7" rx="1" width="7" x="14" y="14" />
          <rect height="7" rx="1" width="7" x="3" y="14" />
        </svg>
        Dashboard
      </a>
      <a
        routerLink="/trades"
        routerLinkActive="bg-[#121722] text-white border border-[#1F293D]/60"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-[#121722] transition-all text-sm font-medium"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="8" x2="21" y1="6" y2="6" />
          <line x1="8" x2="21" y1="12" y2="12" />
          <line x1="8" x2="21" y1="18" y2="18" />
          <line x1="3" x2="3.01" y1="6" y2="6" />
          <line x1="3" x2="3.01" y1="12" y2="12" />
          <line x1="3" x2="3.01" y1="18" y2="18" />
        </svg>
        Trades
      </a>
      <a
        routerLink="/playbook"
        routerLinkActive="bg-[#121722] text-white border border-[#1F293D]/60"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-[#121722] transition-all text-sm font-medium"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        Playbook
      </a>
    </div>

    <div class="flex-1"></div>

    <!-- User / logout footer -->
    <div class="p-3 border-t border-[#1F293D]/60">
      <div class="flex items-center justify-between p-2 rounded-xl hover:bg-[#121722] transition">
        <div class="flex items-center gap-2.5">
          <div
            class="w-8 h-8 rounded-lg bg-gradient-to-br from-slate-700 to-slate-900 border border-[#1F293D] flex items-center justify-center"
          >
            <svg
              class="w-4 h-4 text-slate-400"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-xs font-semibold text-slate-200">{{ userName() }}</span>
            <span class="text-[10px] text-emerald-400 font-mono">Signed in</span>
          </div>
        </div>
        <button
          (click)="logout()"
          aria-label="Log out"
          class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition-colors"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Reserve the scrollbar's space so content doesn't shift when a page starts scrolling -->
  <div
    class="flex-1 overflow-y-auto [scrollbar-gutter:stable]"
    [class.shadow-[inset_0_3px_0_#8b5cf6]]="tradeMode.isBacktest()"
  >
    <router-outlet />
  </div>
</div>
