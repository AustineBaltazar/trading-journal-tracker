<div class="p-6 max-w-md">
  <h1 class="text-xl font-semibold mb-4">Playbook: Rules</h1>

  @if (errorMessage) {
    <p class="text-red-600 text-sm mb-3">{{ errorMessage }}</p>
  }

  <form (ngSubmit)="addRule()" class="flex gap-2 mb-6">
    <input
      type="text"
      [(ngModel)]="newRuleName"
      name="newRuleName"
      placeholder="New rule"
      class="flex-1 border rounded px-3 py-2"
    />
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Add</button>
  </form>

  @if (rules().length === 0) {
    <p class="text-gray-500">No rules yet.</p>
  } @else {
    <ul>
      @for (rule of rules(); track rule.id) {
        <li class="flex justify-between items-center border-b py-2">
          <span>{{ rule.name }}</span>
          <button (click)="deleteRule(rule.id)" class="text-sm text-red-600">Delete</button>
        </li>
      }
    </ul>
  }
</div>
