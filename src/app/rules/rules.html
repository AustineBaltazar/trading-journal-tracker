<div class="p-6 max-w-md">
  <h1 class="text-xl font-semibold mb-4">Playbook: Rules</h1>

  @if (errorMessage) {
    <p class="text-danger text-sm mb-3">{{ errorMessage }}</p>
  }

  <form (ngSubmit)="addRule()" class="flex gap-2 mb-6">
    <input
      type="text"
      [(ngModel)]="newRuleName"
      name="newRuleName"
      placeholder="New rule"
      class="flex-1 bg-bg-raised border border-border-default rounded px-3 py-2 text-text-primary"
    />
    <button
      type="submit"
      class="bg-accent-solid text-text-on-accent px-4 py-2 rounded hover:opacity-90"
    >
      Add
    </button>
  </form>

  @if (rules().length === 0) {
    <p class="text-text-muted">No rules yet.</p>
  } @else {
    <ul
      class="bg-bg-surface border border-border-default rounded-lg divide-y divide-border-default"
    >
      @for (rule of rules(); track rule.id) {
        <li class="flex justify-between items-center px-4 py-3">
          <span>{{ rule.name }}</span>
          <button (click)="deleteRule(rule.id)" class="text-sm text-danger">Delete</button>
        </li>
      }
    </ul>
  }
</div>
