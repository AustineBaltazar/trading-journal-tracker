<div
  class="bg-[#111726] rounded-2xl overflow-hidden"
  style="
    box-shadow:
      0 25px 60px -15px rgba(0, 0, 0, 0.8),
      0 0 0 1px rgba(255, 255, 255, 0.08);
  "
>
  <div class="h-1 w-full bg-gradient-to-r from-blue-600 via-sky-400 to-indigo-600"></div>

  <div class="flex items-center justify-between px-6 pt-5 pb-3">
    <div class="flex items-center gap-2">
      <h2 class="text-lg font-semibold text-white tracking-tight">Edit trade</h2>
      @if (mode === 'backtest') {
        <span
          class="px-2 py-0.5 rounded-md text-[10px] font-extrabold tracking-widest text-violet-300 bg-violet-500/15 border border-violet-500/45"
          >BACKTEST</span
        >
      }
    </div>
    <button
      (click)="cancel()"
      type="button"
      class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/70 transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  @if (!loaded()) {
    <p class="text-slate-500 text-sm px-6 pb-6">Loading...</p>
  } @else {
    <form (ngSubmit)="onSubmit()" class="px-6 py-2 space-y-4 max-h-[75vh] overflow-y-auto">
      @if (errorMessage) {
        <p class="text-rose-400 text-xs">{{ errorMessage }}</p>
      }

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Mode</label>
        <div
          role="radiogroup"
          aria-label="Trade mode"
          class="grid grid-cols-2 gap-2 p-1 bg-[#141c2c] border border-[#24334d] rounded-xl text-xs font-semibold"
        >
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="mode === 'live'"
            (click)="setMode('live')"
            class="py-1.5 rounded-lg border transition-colors"
            [class]="
              mode === 'live'
                ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/40'
                : 'border-transparent text-slate-400 hover:text-slate-200'
            "
          >
            Live
          </button>
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="mode === 'backtest'"
            (click)="setMode('backtest')"
            class="py-1.5 rounded-lg border transition-colors"
            [class]="
              mode === 'backtest'
                ? 'bg-violet-500/15 text-violet-300 border-violet-500/45'
                : 'border-transparent text-slate-400 hover:text-slate-200'
            "
          >
            Backtest
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Date</label>
          <input
            type="date"
            [(ngModel)]="trade_date"
            name="trade_date"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Symbol</label>
          <select
            [(ngModel)]="symbol"
            name="symbol"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-medium transition cursor-pointer"
          >
            <option value="MNQ">MNQ (Micro E-mini NQ)</option>
            <option value="NQ">NQ (E-mini Nasdaq-100)</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Direction</label>
          <div class="grid grid-cols-2 gap-2 p-1 bg-[#141c2c] border border-[#24334d] rounded-xl">
            <button
              type="button"
              (click)="setDirection('long')"
              [class]="
                'py-1.5 px-3 text-xs font-semibold rounded-lg flex items-center justify-center gap-1.5 transition-colors ' +
                (direction === 'long'
                  ? 'bg-blue-600/30 text-blue-300 border border-blue-500/70'
                  : 'text-slate-400 hover:text-slate-200')
              "
            >
              <svg
                class="w-3.5 h-3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  d="M5 10l7-7m0 0l7 7m-7-7v18"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Long
            </button>
            <button
              type="button"
              (click)="setDirection('short')"
              [class]="
                'py-1.5 px-3 text-xs font-semibold rounded-lg flex items-center justify-center gap-1.5 transition-colors ' +
                (direction === 'short'
                  ? 'bg-blue-600/30 text-blue-300 border border-blue-500/70'
                  : 'text-slate-400 hover:text-slate-200')
              "
            >
              <svg
                class="w-3.5 h-3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  d="M19 14l-7 7m0 0l-7-7m7 7V3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Short
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Contracts</label>
          <input
            type="number"
            min="1"
            step="1"
            [(ngModel)]="contracts"
            name="contracts"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Entry price</label>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="entry_price"
            name="entry_price"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Exit price</label>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="exit_price"
            name="exit_price"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Fees ($)</label>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="fees"
            name="fees"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Strategy</label>
          <input
            type="text"
            [(ngModel)]="strategy"
            name="strategy"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 transition"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Entry time</label>
          <input
            type="time"
            [(ngModel)]="entry_time"
            name="entry_time"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Exit time</label>
          <input
            type="time"
            [(ngModel)]="exit_time"
            name="exit_time"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Duration</label>
          <div
            class="w-full bg-[#0e1423] border border-[#1e2a42] text-slate-300 text-xs rounded-xl px-3.5 py-2.5 font-mono"
          >
            {{ duration ?? '—' }}
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Session</label>
          <select
            [(ngModel)]="session"
            name="session"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-medium transition cursor-pointer"
          >
            <option value="">—</option>
            @for (option of sessions; track option) {
              <option [value]="option">{{ option }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Emotion</label>
          <select
            [(ngModel)]="emotion"
            name="emotion"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-medium transition cursor-pointer"
          >
            <option value="">—</option>
            @for (option of emotions; track option) {
              <option [value]="option">{{ option }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Grade</label>
          <select
            [(ngModel)]="grade"
            name="grade"
            class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 font-medium transition cursor-pointer"
          >
            <option value="">—</option>
            @for (option of grades; track option) {
              <option [value]="option">{{ option }}</option>
            }
          </select>
        </div>
      </div>

      @if (allRules().length > 0) {
        <div class="pt-1.5">
          <label
            class="flex items-center justify-between text-xs font-medium text-slate-300 mb-2.5"
          >
            <span>Rules followed</span>
            <span class="text-[10px] text-blue-400 font-mono font-normal"
              >{{ checkedRuleIds().size }}/{{ allRules().length }} checked</span
            >
          </label>
          <div class="space-y-2 bg-[#0e1423] p-3 rounded-xl border border-[#1e2a42]">
            @for (rule of allRules(); track rule.id) {
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input
                  type="checkbox"
                  [checked]="isRuleChecked(rule.id)"
                  (change)="toggleRuleChecked(rule.id, $event)"
                  class="w-4 h-4 rounded text-blue-600 bg-[#161e30] border-[#293854] focus:ring-blue-500/40 cursor-pointer"
                />
                <span class="text-xs text-slate-300">{{ rule.name }}</span>
              </label>
            }
          </div>
        </div>
      }

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Screenshot link</label>
        <input
          type="text"
          [(ngModel)]="screenshot_link"
          name="screenshot_link"
          placeholder="https://www.tradingview.com/x/AbC123/"
          class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-blue-400 text-xs rounded-xl px-3.5 py-2.5 font-mono transition"
        />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Notes</label>
        <textarea
          [(ngModel)]="notes"
          name="notes"
          rows="3"
          class="w-full bg-[#161e30] border border-[#26354f] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-xs rounded-xl p-3 leading-relaxed resize-y transition"
        ></textarea>
      </div>

      <div class="pt-4 pb-1 grid grid-cols-2 gap-3">
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold text-xs py-2.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-1.5 border border-blue-400/20"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Save changes
        </button>
        <button
          type="button"
          (click)="cancel()"
          class="w-full bg-[#182133] hover:bg-[#202c42] active:bg-[#141b2b] text-slate-300 hover:text-white font-medium text-xs py-2.5 px-4 rounded-xl border border-[#2b3a55] transition-all"
        >
          Cancel
        </button>
      </div>
    </form>
  }
</div>
