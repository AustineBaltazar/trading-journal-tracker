<div class="min-h-screen bg-[#0B0E14] flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center gap-3 mb-8">
      <div
        class="h-12 w-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-emerald-400 p-[1.5px] flex items-center justify-center shadow-lg shadow-blue-500/20"
      >
        <div class="h-full w-full bg-[#0B0E14] rounded-[14px] flex items-center justify-center">
          <svg
            class="w-6 h-6 text-emerald-400"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            viewBox="0 0 24 24"
          >
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="font-extrabold tracking-tight text-white text-lg">TEST MNQ</span>
        <span class="text-sm text-slate-500 font-mono">/</span>
        <span class="text-sm font-semibold text-slate-300 tracking-wider">JOURNAL</span>
      </div>
    </div>

    <form
      (ngSubmit)="onSubmit()"
      class="bg-[#121722] border border-[#1F293D] rounded-2xl p-6 shadow-xl"
    >
      <h1 class="text-lg font-semibold text-white mb-1">Welcome back</h1>
      <p class="text-xs text-slate-400 mb-6">Log in to your trading journal</p>

      @if (errorMessage) {
        <p
          class="text-rose-400 text-xs bg-rose-500/10 border border-rose-500/20 rounded-lg px-3 py-2 mb-4"
        >
          {{ errorMessage }}
        </p>
      }

      <label class="block text-xs font-medium text-slate-300 mb-1.5">Email</label>
      <input
        type="text"
        [(ngModel)]="email"
        name="email"
        class="w-full bg-[#0E131C] border border-[#1F293D] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-sm rounded-xl px-3.5 py-2.5 mb-4 transition"
      />

      <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        class="w-full bg-[#0E131C] border border-[#1F293D] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-sm rounded-xl px-3.5 py-2.5 mb-6 transition"
      />

      <button
        type="submit"
        class="w-full bg-gradient-to-r from-blue-600 to-emerald-500 hover:from-blue-500 hover:to-emerald-400 text-white font-semibold text-sm py-2.5 rounded-xl shadow-lg transition-all"
      >
        Log in
      </button>

      <p class="text-center text-xs text-slate-500 mt-5">
        Don't have an account?
        <a routerLink="/register" class="text-blue-400 hover:text-blue-300 font-medium">Sign up</a>
      </p>
    </form>
  </div>
</div>
