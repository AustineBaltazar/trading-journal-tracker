<div class="p-6 max-w-md">
  <h1 class="text-xl font-semibold mb-4">New Trade</h1>

  <form (ngSubmit)="onSubmit()" class="bg-bg-surface border border-border-default rounded-lg p-6">
    @if (errorMessage) {
      <p class="text-danger text-sm mb-3">{{ errorMessage }}</p>
    }

    <label class="block text-sm mb-1 text-text-secondary">Date</label>
    <input
      type="date"
      [(ngModel)]="trade_date"
      name="trade_date"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-3 text-text-primary"
    />

    <label class="block text-sm mb-1 text-text-secondary">Symbol</label>
    <select
      [(ngModel)]="symbol"
      name="symbol"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-3 text-text-primary"
    >
      <option value="MNQ">MNQ</option>
      <option value="NQ">NQ</option>
    </select>

    <label class="block text-sm mb-1 text-text-secondary">Direction</label>
    <select
      [(ngModel)]="direction"
      name="direction"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-3 text-text-primary"
    >
      <option value="long">Long</option>
      <option value="short">Short</option>
    </select>

    <label class="block text-sm mb-1 text-text-secondary">Contracts</label>
    <input
      type="number"
      [(ngModel)]="contracts"
      name="contracts"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-3 text-text-primary"
    />

    <label class="block text-sm mb-1 text-text-secondary">Entry Price</label>
    <input
      type="number"
      step="0.01"
      [(ngModel)]="entry_price"
      name="entry_price"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-3 text-text-primary"
    />

    <label class="block text-sm mb-1 text-text-secondary">Exit Price</label>
    <input
      type="number"
      step="0.01"
      [(ngModel)]="exit_price"
      name="exit_price"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-3 text-text-primary"
    />

    <label class="block text-sm mb-1 text-text-secondary">Fees</label>
    <input
      type="number"
      step="0.01"
      [(ngModel)]="fees"
      name="fees"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-3 text-text-primary"
    />

    <label class="block text-sm mb-1 text-text-secondary">Strategy</label>
    <input
      type="text"
      [(ngModel)]="strategy"
      name="strategy"
      class="w-full bg-bg-raised border border-border-default rounded px-3 py-2 mb-4 text-text-primary"
    />

    <button
      type="submit"
      class="w-full bg-accent-solid text-text-on-accent py-2 rounded hover:opacity-90"
    >
      Save Trade
    </button>
  </form>
</div>
