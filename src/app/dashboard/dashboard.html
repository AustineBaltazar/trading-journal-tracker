<div class="p-6">
  <h1 class="text-xl font-semibold mb-4">Dashboard</h1>

  @if (summary() === null) {
    <p class="text-text-muted">Loading...</p>
  } @else {
    <div class="grid grid-cols-4 gap-4">
      <div class="bg-bg-surface border border-border-default rounded-lg p-4">
        <p class="text-sm text-text-secondary">Total P/L</p>
        <p
          class="text-2xl font-semibold"
          [class.text-success]="summary().totalPnl > 0"
          [class.text-danger]="summary().totalPnl < 0"
        >
          {{ summary().totalPnl }}
        </p>
      </div>
      <div class="bg-bg-surface border border-border-default rounded-lg p-4">
        <p class="text-sm text-text-secondary">Win Rate</p>
        <p class="text-2xl font-semibold">{{ summary().winRate }}%</p>
      </div>
      <div class="bg-bg-surface border border-border-default rounded-lg p-4">
        <p class="text-sm text-text-secondary">Trades</p>
        <p class="text-2xl font-semibold">{{ summary().totalTrades }}</p>
      </div>
      <div class="bg-bg-surface border border-border-default rounded-lg p-4">
        <p class="text-sm text-text-secondary">Wins / Losses</p>
        <p class="text-2xl font-semibold">{{ summary().wins }} / {{ summary().losses }}</p>
      </div>
    </div>
  }

  <a routerLink="/trades" class="inline-block mt-6 text-sm text-accent">View all trades →</a>
</div>
