<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-semibold">Your Trades</h1>
    <div class="flex gap-3">
      <a routerLink="/trades/new" class="text-sm text-blue-600">+ New Trade</a>
      <button (click)="logout()" class="text-sm text-red-600">Log out</button>
    </div>
  </div>

  @if (trades().length === 0) {
    <p class="text-gray-500">No trades yet.</p>
  } @else {
    <table class="w-full border-collapse">
      <thead>
        <tr class="text-left border-b">
          <th class="py-2">Date</th>
          <th class="py-2">Symbol</th>
          <th class="py-2">Direction</th>
          <th class="py-2">Net P/L</th>
          <th class="py-2"></th>
        </tr>
      </thead>
      <tbody>
        @for (trade of trades(); track trade.id) {
          <tr class="border-b">
            <td class="py-2">{{ trade.trade_date }}</td>
            <td class="py-2">{{ trade.symbol }}</td>
            <td class="py-2">{{ trade.direction }}</td>
            <td
              class="py-2"
              [class.text-green-600]="trade.netPnl > 0"
              [class.text-red-600]="trade.netPnl < 0"
            >
              {{ trade.netPnl }}
            </td>
            <td class="py-2">
              <a [routerLink]="['/trades/edit', trade.id]" class="text-sm text-blue-600 mr-3"
                >Edit</a
              >
              <button (click)="deleteTrade(trade.id)" class="text-sm text-red-600">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
