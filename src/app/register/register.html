<app-auth-shell>
  <form (ngSubmit)="onSubmit()">
    <h1 class="text-lg font-semibold text-white mb-1">Create your account</h1>
    <p class="text-xs text-slate-400 mb-6">Start journaling your trades</p>

    @if (errorMessage()) {
      <p
        role="alert"
        class="text-rose-300 text-xs bg-rose-500/10 border border-rose-500/20 rounded-lg px-3 py-2 mb-4"
      >
        {{ errorMessage() }}
      </p>
    }

    <label for="reg-name" class="block text-xs font-medium text-slate-300 mb-1.5">Name</label>
    <input
      id="reg-name"
      type="text"
      autocomplete="name"
      maxlength="60"
      [(ngModel)]="name"
      name="name"
      class="w-full bg-[#0E131C] border border-[#1F293D] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-sm rounded-xl px-3.5 py-2.5 mb-4 transition"
    />

    <label for="reg-email" class="block text-xs font-medium text-slate-300 mb-1.5">Email</label>
    <input
      id="reg-email"
      type="email"
      autocomplete="email"
      [(ngModel)]="email"
      name="email"
      class="w-full bg-[#0E131C] border border-[#1F293D] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-sm rounded-xl px-3.5 py-2.5 mb-4 transition"
    />

    <div class="flex items-baseline justify-between mb-1.5">
      <label for="reg-password" class="text-xs font-medium text-slate-300">Password</label>
      <span class="text-[11px] text-slate-400">{{ strength.label }}</span>
    </div>
    <div class="relative">
      <input
        id="reg-password"
        [type]="showPassword() ? 'text' : 'password'"
        autocomplete="new-password"
        maxlength="128"
        [(ngModel)]="password"
        name="password"
        aria-describedby="reg-password-rules"
        class="w-full bg-[#0E131C] border border-[#1F293D] focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-slate-200 text-sm rounded-xl pl-3.5 pr-16 py-2.5 transition"
      />
      <button
        type="button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-pressed]="showPassword()"
        class="absolute right-2 top-1/2 -translate-y-1/2 text-[11px] text-slate-400 hover:text-slate-200 px-2 py-1"
      >
        {{ showPassword() ? 'Hide' : 'Show' }}
      </button>
    </div>
    <app-password-strength
      class="mb-4"
      rulesId="reg-password-rules"
      [password]="password"
      [email]="email"
    />

    @if (turnstileOn) {
      <app-turnstile class="mb-4" (token)="turnstileToken.set($event)" />
    }

    <button
      type="submit"
      [disabled]="!canSubmit"
      class="w-full bg-gradient-to-r from-blue-600 to-emerald-500 hover:from-blue-500 hover:to-emerald-400 text-white font-semibold text-sm py-2.5 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="text-center text-xs text-slate-500 mt-5">
      Already have an account?
      <a routerLink="/login" class="text-blue-400 hover:text-blue-300 font-medium">Log in</a>
    </p>
  </form>
</app-auth-shell>
